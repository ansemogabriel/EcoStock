<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de validação — EcoStock</title>
<link rel="icon" type="image/svg+xml" href="img/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=7">
<link rel="stylesheet" href="css/dashboard.css?v=7">
<link rel="stylesheet" href="css/app.css?v=7">
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="topbar no-print">
      <div>
        <h1>Relatório de validação</h1>
        <p class="page-sub">Registro do uso real do sistema em um período: cada alerta emitido, a decisão do comerciante, a reação da equipe e o resultado.</p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="imprimir">Imprimir ou salvar PDF</button>
      </div>
    </header>

    <div class="toolbar no-print">
      <div class="seg" id="atalhos" aria-label="Período rápido">
        <button type="button" data-d="0">Hoje</button>
        <button type="button" data-d="1">Últimos 2 dias</button>
        <button type="button" class="active" data-d="6">Últimos 7 dias</button>
        <button type="button" data-d="29">Últimos 30 dias</button>
      </div>
      <div class="date-range">
        <label class="pick">De<input type="date" id="fDe"></label>
        <label class="pick">Até<input type="date" id="fAte"></label>
      </div>
    </div>

    <div class="filterbar no-print" id="filtros">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input class="input" type="search" id="fBusca" placeholder="Buscar produto ou lote" aria-label="Buscar produto ou lote">
      </label>
      <label class="pick">Situação<select id="fSituacao">
        <option value="">Todos os alertas</option>
        <option value="resolvido">Com resultado registrado</option>
        <option value="andamento">Ainda em andamento</option>
        <option value="observacao">Com observação da equipe</option>
      </select></label>
      <label class="pick">Categoria<select id="fCategoria"></select></label>
      <div class="filter-meta"></div>
    </div>

    <div id="relatorio" aria-live="polite"><div class="state">Carregando relatório...</div></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12l6 6L21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span id="toastMsg">Feito!</span>
</div>

<script src="js/api.js?v=7"></script>
<script src="js/Auth.js?v=7"></script>
<script src="js/app.js?v=7"></script>
<script src="js/validacao.js?v=7"></script>
</body>
</html>
